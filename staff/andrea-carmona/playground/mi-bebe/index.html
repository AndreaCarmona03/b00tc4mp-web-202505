<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Mi Bebesito Hermoso 💖</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: url('fondo_azul_negro_estrellado.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      color: #ff4d4d;
    }

    h1,
    h2 {
      text-align: center;
      margin: 20px 0 10px;
      color: #ff4d4d;
      /* rojo suave parecido al LOVE */
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.5em;
    }

    h2 {
      font-size: 2em;
    }
  </style>
</head>

<body>
  <h1>Para Mi Bebesito Hermoso 💖</h1>
  <h2>❤️ Te Amo ❤️</h2>
  <canvas id="canvas"></canvas>
  <audio autoplay loop preload="auto" controls style="position: fixed; bottom: 20px; left: 20px; z-index: 100px;">
    <source src="Cancion you-are-so-beautiful.mp3" type="audio/mpeg" />
    Tu navegador no soporta audio HTML5.
  </audio>
  <script src="script.js"></script>
</body>

</html>
